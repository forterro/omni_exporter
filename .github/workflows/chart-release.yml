# Publish the container image and the Helm chart on version tags (e.g. v0.1.0).
#
# Everything is parameterized by the repository OWNER, so this workflow runs
# unchanged on the upstream repo and on any fork: images and chart are published
# under ghcr.io/<owner>/ with no hardcoded organization.
#
# The image is built through the upstream KRES Makefile target
# (`make image-omni_exporter`), which already knows how to build the multi-arch
# image from the generated Dockerfile. Only REGISTRY / USERNAME / TAG / PUSH are
# overridden — so this survives `make rekres` regenerations untouched.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0).'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve metadata
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${{ github.event.inputs.tag }}"
          [ -z "$tag" ] && tag="${GITHUB_REF_NAME}"
          {
            echo "owner=$owner"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          make image-omni_exporter \
            REGISTRY="${REGISTRY}" \
            USERNAME="${{ steps.meta.outputs.owner }}" \
            TAG="${{ steps.meta.outputs.tag }}" \
            PLATFORM="linux/amd64,linux/arm64" \
            PUSH=true

      - name: Tag latest (final releases only)
        run: |
          case "${{ steps.meta.outputs.tag }}" in
            *-*) echo "Prerelease ${{ steps.meta.outputs.tag }} — not moving :latest"; exit 0 ;;
          esac
          ref="${REGISTRY}/${{ steps.meta.outputs.owner }}/omni_exporter"
          docker buildx imagetools create \
            --tag "${ref}:latest" \
            "${ref}:${{ steps.meta.outputs.tag }}"

  chart:
    name: Package & push Helm chart
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4

      - name: Resolve metadata
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${{ github.event.inputs.tag }}"
          [ -z "$tag" ] && tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          {
            echo "owner=$owner"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v4

      - name: Point chart image at this owner
        run: |
          sed -i \
            -e "s#repository: .*/omni_exporter#repository: ${{ steps.meta.outputs.owner }}/omni_exporter#" \
            deploy/helm/omni-exporter/values.yaml

      - name: Package
        run: |
          helm package deploy/helm/omni-exporter \
            --version "${{ steps.meta.outputs.version }}" \
            --app-version "${{ steps.meta.outputs.tag }}" \
            --destination dist

      - name: Log in to GHCR (OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push chart
        run: |
          helm push \
            "dist/omni-exporter-${{ steps.meta.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ steps.meta.outputs.owner }}/charts"
