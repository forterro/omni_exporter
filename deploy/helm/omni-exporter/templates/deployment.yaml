{{- include "omni-exporter.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omni-exporter.fullname" . }}
  labels:
    {{- include "omni-exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "omni-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if and .Values.webConfig.enabled (not .Values.webConfig.existingSecret) }}
        checksum/web-config: {{ .Values.webConfig.content | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "omni-exporter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "omni-exporter.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: omni-exporter
          image: {{ include "omni-exporter.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --web.listen-address=:{{ .Values.containerPort }}
            - --log.level={{ .Values.exporter.logLevel }}
            - --log.format={{ .Values.exporter.logFormat }}
            {{- if .Values.omni.insecureSkipTLSVerify }}
            - --omni.insecure-skip-tls-verify
            {{- end }}
            {{- if .Values.exporter.enablePprof }}
            - --web.enable-pprof
            {{- end }}
            {{- if .Values.webConfig.enabled }}
            - --web.config.file=/etc/omni-exporter/web-config.yml
            {{- end }}
            {{- with .Values.exporter.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: OMNI_ENDPOINT
              value: {{ .Values.omni.endpoint | quote }}
            - name: OMNI_SERVICE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "omni-exporter.keySecretName" . }}
                  key: {{ include "omni-exporter.keySecretKey" . }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.webConfig.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.webConfig.enabled }}
            - name: web-config
              mountPath: /etc/omni-exporter
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.webConfig.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.webConfig.enabled }}
        - name: web-config
          secret:
            secretName: {{ include "omni-exporter.webConfigSecretName" . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
